[tool.poetry]
name = "casper-prime"
version = "0.1.0-beta.1"
description = "Autonomous AI Development Platform for Indie Developers"
authors = ["Douglas Talley <douglas@legacyai.info>"]
license = "MIT"
readme = "README.md"
packages = [{include = "core"}]
homepage = "https://legacyai.info"
keywords = ["ai", "agent", "cli", "autonomous", "development", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# ---------------------------------------------------------------------------
# Core dependencies — required for CLI, agents, LLM, server, and metrics.
# These are all pure-Python or well-supported wheels; no native build steps.
# ---------------------------------------------------------------------------
[tool.poetry.dependencies]
python = "^3.11"

# LLM Providers
anthropic = "^0.68.0"
openai = "^1.55.3"

# Agentic Orchestration
langchain = "^0.3.0"
langchain-anthropic = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-community = "^0.3.0"
langgraph = "^0.2.0"

# Web Framework & Server
fastapi = "^0.115.5"
uvicorn = {extras = ["standard"], version = "^0.32.1"}
websockets = "^13.1"
python-dotenv = "^1.0.1"
pydantic = "^2.10.2"
pydantic-settings = "^2.6.0"

# CLI Enhancement
click = "^8.1.7"
rich = "^13.9.4"
prompt-toolkit = "^3.0.0"
typer = "^0.15.0"
questionary = "^2.0.0"

# Rate Limiting & Observability
slowapi = "^0.1.9"
prometheus-client = "^0.23.1"
psutil = "^7.1.0"
structlog = "^25.4.0"

# Security
cryptography = "^43.0.0"
PyJWT = "^2.8.0"

# Git Integration (pure Python — no native deps)
gitpython = "^3.1.0"

# Utilities
httpx = "^0.28.0"
aiofiles = "^24.1.0"
pyyaml = "^6.0.2"
tenacity = "^9.0.0"
cachetools = "^5.5.0"

# Optional extras — install with: pipx install -e ".[full]"
# or individually: pipx install -e ".[vector,browser]"

# Vector database & semantic memory (heavy install)
chromadb = {version = "^0.5.0", optional = true}
faiss-cpu = {version = "^1.9.0", optional = true}

# Browser automation (requires separate `playwright install` step)
playwright = {version = "^1.48.0", optional = true}

# Native git bindings (requires libgit2 system library)
pygit2 = {version = "^1.16.0", optional = true}

# Additional LLM providers
google-generativeai = {version = "^0.8.0", optional = true}
cohere = {version = "^5.11.0", optional = true}

# Web scraping & search
beautifulsoup4 = {version = "^4.12.0", optional = true}
duckduckgo-search = {version = "^6.3.0", optional = true}

# Database & caching (requires Redis/PostgreSQL servers)
redis = {version = "^5.2.0", optional = true}
sqlalchemy = {version = "^2.0.36", optional = true}
alembic = {version = "^1.14.0", optional = true}

[tool.poetry.extras]
# All optional dependencies in one group
full = [
    "chromadb", "faiss-cpu",
    "playwright",
    "pygit2",
    "google-generativeai", "cohere",
    "beautifulsoup4", "duckduckgo-search",
    "redis", "sqlalchemy", "alembic",
]
# Individual groups
vector = ["chromadb", "faiss-cpu"]
browser = ["playwright"]
native-git = ["pygit2"]
extra-llm = ["google-generativeai", "cohere"]
web = ["beautifulsoup4", "duckduckgo-search"]
database = ["redis", "sqlalchemy", "alembic"]

# ---------------------------------------------------------------------------
# Development dependencies — not installed by end users
# ---------------------------------------------------------------------------
[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
black = "^24.10.0"
flake8 = "^7.1.1"
mypy = "^1.13.0"
ipython = "^8.29.0"
pytest-xdist = "^3.8.0"
pytest-mock = "^3.15.1"
hypothesis = "^6.140.2"
requests-mock = "^1.12.1"
pre-commit = "^4.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Entry points — creates the `casper` command after installation
# ---------------------------------------------------------------------------
[tool.poetry.scripts]
casper = "core.cli:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
