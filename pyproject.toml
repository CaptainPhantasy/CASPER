[tool.poetry]
name = "casper-prime"
version = "0.1.0"
description = "Autonomous AI Development Platform for Indie Developers"
authors = ["Douglas Talley <douglas@legacyai.info>"]
license = "MIT"
readme = "README.md"
packages = [{include = "core"}]

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.68.0"
openai = "^1.55.3"
fastapi = "^0.115.5"
uvicorn = {extras = ["standard"], version = "^0.32.1"}
websockets = "^13.1"
python-dotenv = "^1.0.1"
pydantic = "^2.10.2"
redis = "^5.2.0"
aiofiles = "^24.1.0"
pyyaml = "^6.0.2"
click = "^8.1.7"
rich = "^13.9.4"
httpx = "^0.28.0"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
slowapi = "^0.1.9"
prometheus-client = "^0.23.1"
psutil = "^7.1.0"
structlog = "^25.4.0"
cryptography = "^43.0.0"

# Agentic Orchestration Frameworks
langchain = "^0.3.0"
langchain-anthropic = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-community = "^0.3.0"
langgraph = "^0.2.0"

# CLI Enhancement Libraries
prompt-toolkit = "^3.0.0"
typer = "^0.15.0"
questionary = "^2.0.0"

# Git Integration
gitpython = "^3.1.0"
pygit2 = "^1.16.0"

# Additional API SDKs
google-generativeai = "^0.8.0"
cohere = "^5.11.0"

# Vector Database & Memory
chromadb = "^0.5.0"
faiss-cpu = "^1.9.0"

# Tool Integration
beautifulsoup4 = "^4.12.0"
playwright = "^1.48.0"
duckduckgo-search = "^6.3.0"

# Additional utilities
pydantic-settings = "^2.6.0"
tenacity = "^9.0.0"
cachetools = "^5.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
black = "^24.10.0"
flake8 = "^7.1.1"
mypy = "^1.13.0"
ipython = "^8.29.0"
pytest-xdist = "^3.8.0"
pytest-mock = "^3.15.1"
hypothesis = "^6.140.2"
requests-mock = "^1.12.1"
pre-commit = "^4.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
casper = "core.cli:main"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
