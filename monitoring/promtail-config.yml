# Promtail Configuration for CASPER Prime Log Collection

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # CASPER Prime Application Logs
  - job_name: casper-application
    static_configs:
      - targets:
          - localhost
        labels:
          job: casper-prime
          service: application
          __path__: /var/log/casper/app.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            module: module
            request_id: request_id
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          module:
          request_id:

  # Terminal Command Logs
  - job_name: terminal-commands
    static_configs:
      - targets:
          - localhost
        labels:
          job: casper-terminal
          service: terminal
          __path__: /var/log/casper/terminal.log
    pipeline_stages:
      - json:
          expressions:
            session_id: session_id
            user_id: user_id
            command: command
            exit_code: exit_code
            duration_ms: duration_ms
            timestamp: timestamp
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          session_id:
          user_id:

  # WebSocket Connection Logs
  - job_name: websocket-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: casper-websocket
          service: websocket
          __path__: /var/log/casper/websocket.log
    pipeline_stages:
      - json:
          expressions:
            connection_id: connection_id
            event_type: event_type
            client_ip: client_ip
            user_agent: user_agent
            timestamp: timestamp
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          connection_id:
          event_type:

  # System Error Logs
  - job_name: system-errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: casper-errors
          service: system
          __path__: /var/log/casper/error.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            error_type: error_type
            stack_trace: stack_trace
            timestamp: timestamp
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          error_type:

  # Nginx Access Logs
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: proxy
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<request_uri>\S+) (?P<http_version>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)".*rt=(?P<request_time>\S+)'
      - timestamp:
          source: time_local
          format: 02/Jan/2006:15:04:05 -0700
      - labels:
          method:
          status:
          remote_addr:

  # Nginx Error Logs
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: proxy
          log_type: error
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<pid>\d+)#(?P<tid>\d+): (?P<message>.*)'
      - timestamp:
          source: timestamp
          format: 2006/01/02 15:04:05
      - labels:
          level:

  # Container Logs (if running in Docker)
  - job_name: container-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/casper-(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            message: log
      - timestamp:
          source: timestamp
          format: RFC3339Nano