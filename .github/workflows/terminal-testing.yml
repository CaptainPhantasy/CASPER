name: Terminal Infrastructure Testing

on:
  push:
    branches: [ main, develop, 'feature/terminal-*' ]
    paths:
      - 'core/terminal/**'
      - 'dashboard/src/components/Terminal/**'
      - 'tests/test_terminal_*'
      - 'tests/conftest_terminal.py'
      - '.github/workflows/terminal-testing.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'core/terminal/**'
      - 'dashboard/src/components/Terminal/**'
      - 'tests/test_terminal_*'
      - 'tests/conftest_terminal.py'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  COVERAGE_THRESHOLD: 85

jobs:
  # Backend terminal tests
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev,test

    - name: Run backend unit tests
      run: |
        poetry run pytest tests/test_terminal_pty.py \
                         tests/test_terminal_websocket.py \
                         tests/test_terminal_command_proxy.py \
                         tests/test_terminal_server_integration.py \
                         -v \
                         --cov=core.terminal \
                         --cov-report=xml \
                         --cov-report=html \
                         --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
                         --junit-xml=backend-test-results.xml \
                         -m "unit and not slow"

    - name: Run backend integration tests
      run: |
        poetry run pytest tests/test_terminal_*integration*.py \
                         -v \
                         --cov=core.terminal \
                         --cov-append \
                         --cov-report=xml \
                         --junit-xml=backend-integration-results.xml \
                         -m "integration"

    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend,terminal
        name: backend-coverage
        fail_ci_if_error: true

    - name: Upload backend test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: |
          backend-test-results.xml
          backend-integration-results.xml
          htmlcov/

  # Security tests
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev,test

    - name: Run security tests
      run: |
        poetry run pytest tests/test_terminal_security.py \
                         -v \
                         --cov=core.terminal.security \
                         --cov-report=xml \
                         --junit-xml=security-test-results.xml \
                         -m "security"

    - name: Upload security coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: security,terminal
        name: security-coverage
        fail_ci_if_error: true

    - name: Upload security test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-test-results
        path: security-test-results.xml

  # Performance tests
  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev,test

    - name: Run performance tests
      run: |
        poetry run pytest tests/test_terminal_performance.py \
                         -v \
                         --junit-xml=performance-test-results.xml \
                         -m "performance" \
                         --tb=short

    - name: Generate performance report
      run: |
        poetry run python -c "
        import json
        import sys
        from pathlib import Path

        # Generate performance summary
        summary = {
          'timestamp': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
          'commit': '${{ github.sha }}',
          'branch': '${{ github.ref_name }}',
          'runner': 'ubuntu-latest',
          'status': 'completed'
        }

        Path('performance-summary.json').write_text(json.dumps(summary, indent=2))
        print('Performance tests completed')
        "

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: |
          performance-test-results.xml
          performance-summary.json

  # Frontend terminal tests
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
        cache-dependency-path: dashboard/yarn.lock

    - name: Install frontend dependencies
      run: |
        cd dashboard
        yarn install --frozen-lockfile

    - name: Run frontend terminal component tests
      run: |
        cd dashboard
        # Run tests for terminal components specifically
        yarn test -- \
          --testPathPattern="Terminal|terminal" \
          --coverage \
          --coverageDirectory=coverage-terminal \
          --coverageThreshold='{"global":{"statements":85,"branches":85,"functions":85,"lines":85}}' \
          --watchAll=false \
          --ci

    - name: Upload frontend coverage
      uses: codecov/codecov-action@v3
      with:
        directory: ./dashboard/coverage-terminal
        flags: frontend,terminal
        name: frontend-coverage
        fail_ci_if_error: true

    - name: Upload frontend test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: frontend-test-results
        path: dashboard/coverage-terminal/

  # E2E tests with Playwright
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Start backend service for E2E tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: casper_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
        cache-dependency-path: dashboard/yarn.lock

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install

    - name: Install frontend dependencies
      run: |
        cd dashboard
        yarn install --frozen-lockfile

    - name: Build frontend
      run: |
        cd dashboard
        yarn build

    - name: Install Playwright browsers
      run: |
        cd dashboard
        npx playwright install --with-deps chromium firefox

    - name: Start backend server
      run: |
        poetry run python -m core.server &
        echo $! > backend.pid
        # Wait for server to start
        sleep 10
      env:
        DATABASE_URL: postgresql://postgres:test@localhost/casper_test
        CASPER_TEST_MODE: true

    - name: Start frontend preview
      run: |
        cd dashboard
        yarn preview --port 4173 &
        echo $! > frontend.pid
        # Wait for frontend to start
        sleep 5

    - name: Run E2E tests
      run: |
        cd dashboard
        npx playwright test \
          --config=playwright.config.ts \
          --reporter=html \
          --grep="terminal|Terminal"
      env:
        CI: true

    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: |
          dashboard/playwright-report/
          dashboard/test-results/

    - name: Stop servers
      if: always()
      run: |
        # Stop servers
        if [ -f backend.pid ]; then kill $(cat backend.pid) || true; fi
        if [ -f frontend.pid ]; then kill $(cat frontend.pid) || true; fi

  # Layout integration tests
  layout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
        cache-dependency-path: dashboard/yarn.lock

    - name: Install frontend dependencies
      run: |
        cd dashboard
        yarn install --frozen-lockfile

    - name: Build frontend
      run: |
        cd dashboard
        yarn build

    - name: Install Playwright
      run: |
        cd dashboard
        npx playwright install --with-deps chromium

    - name: Start frontend for layout tests
      run: |
        cd dashboard
        yarn preview --port 4173 &
        sleep 5

    - name: Run layout integration tests
      run: |
        python -m pytest tests/test_terminal_layout_integration.py \
          -v \
          --junit-xml=layout-test-results.xml \
          -m "not slow"

    - name: Upload layout test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: layout-test-results
        path: layout-test-results.xml

  # Code quality and security scanning
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev,lint

    - name: Run linting
      run: |
        poetry run flake8 core/terminal/ --count --select=E9,F63,F7,F82 --show-source --statistics
        poetry run flake8 core/terminal/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run type checking
      run: |
        poetry run mypy core/terminal/ --ignore-missing-imports

    - name: Run security checks
      run: |
        poetry run bandit -r core/terminal/ -f json -o bandit-report.json
        poetry run safety check --json --output safety-report.json
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # Collect and combine results
  test-summary:
    runs-on: ubuntu-latest
    needs: [backend-tests, security-tests, performance-tests, frontend-tests, e2e-tests, layout-tests, code-quality]
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Download all test artifacts
      uses: actions/download-artifact@v3

    - name: Generate test summary
      run: |
        python3 - << 'EOF'
        import json
        import xml.etree.ElementTree as ET
        from pathlib import Path
        import glob

        summary = {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "workflow": "terminal-testing",
            "results": {}
        }

        # Process JUnit XML files
        for xml_file in glob.glob("**/test-results.xml", recursive=True) + glob.glob("**/*-test-results.xml", recursive=True):
            try:
                tree = ET.parse(xml_file)
                root = tree.getroot()

                test_suite = Path(xml_file).parent.name
                summary["results"][test_suite] = {
                    "tests": int(root.get("tests", 0)),
                    "failures": int(root.get("failures", 0)),
                    "errors": int(root.get("errors", 0)),
                    "time": float(root.get("time", 0)),
                    "file": xml_file
                }
            except Exception as e:
                print(f"Error processing {xml_file}: {e}")

        # Calculate totals
        total_tests = sum(r.get("tests", 0) for r in summary["results"].values())
        total_failures = sum(r.get("failures", 0) for r in summary["results"].values())
        total_errors = sum(r.get("errors", 0) for r in summary["results"].values())

        summary["totals"] = {
            "tests": total_tests,
            "failures": total_failures,
            "errors": total_errors,
            "success_rate": (total_tests - total_failures - total_errors) / total_tests * 100 if total_tests > 0 else 0
        }

        # Write summary
        with open("test-summary.json", "w") as f:
            json.dump(summary, f, indent=2)

        print(f"Terminal testing summary:")
        print(f"Total tests: {total_tests}")
        print(f"Failures: {total_failures}")
        print(f"Errors: {total_errors}")
        print(f"Success rate: {summary['totals']['success_rate']:.1f}%")

        # Fail if success rate is too low
        if summary['totals']['success_rate'] < 90:
            print("ERROR: Test success rate too low!")
            exit(1)
        EOF

    - name: Upload test summary
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-summary
        path: test-summary.json

    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');

          try {
            const summary = JSON.parse(fs.readFileSync('test-summary.json', 'utf8'));

            const comment = `
          ## 🧪 Terminal Testing Results

          **Overall Results:**
          - **Total Tests:** ${summary.totals.tests}
          - **Success Rate:** ${summary.totals.success_rate.toFixed(1)}%
          - **Failures:** ${summary.totals.failures}
          - **Errors:** ${summary.totals.errors}

          **Test Suites:**
          ${Object.entries(summary.results).map(([suite, results]) =>
            `- **${suite}**: ${results.tests} tests, ${results.failures} failures, ${results.errors} errors`
          ).join('\n')}

          **Coverage:** Available in the [Codecov report](https://codecov.io/gh/${{ github.repository }}/pull/${{ github.event.number }})

          ${summary.totals.success_rate >= 90 ? '✅ All tests passing!' : '❌ Some tests failed'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not post test summary comment:', error);
          }