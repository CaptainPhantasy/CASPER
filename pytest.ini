[pytest]
addopts = --ignore=casper-prime --strict-markers
asyncio_mode = auto
markers =
    unit: fast isolated unit test
    integration: test crossing component or process boundaries
    security: security-policy and hostile-input test
    performance: performance measurement with explicit thresholds
    stress: high-load or resource-intensive test
    slow: test excluded from the default fast feedback loop
    browser_e2e: live dashboard and installed-browser end-to-end test
